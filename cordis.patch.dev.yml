    name: "C:/Users/15019/WorkBuddy/自制游戏生灵/metaspirit/dsh-plugin/src/index.ts"
    config:
      enginePath: "C:/Users/15019/WorkBuddy/自制游戏生灵/metaspirit/dsh-plugin/engine"
      game: "minecraft"
      mllm:
        fast:
          provider: "openai"
          model: "deepseek-v4-flash"
          base_url_env: "DEEPSEEK_BASE_URL"
        deep:
          provider: "openai"
          model: "deepseek-v4"
          base_url_env: "DEEPSEEK_BASE_URL"
      budget:
        daily_usd_cap: 10.0
