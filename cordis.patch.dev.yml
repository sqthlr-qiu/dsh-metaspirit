# cordis.patch.dev.yml —— 开发模式挂载（绝对路径，免安装验证用）
# 用法：把 <ABS_PLUGIN_DIR> 替换为你本机的 dsh-plugin 绝对路径，然后：
#   dsh --profile web --patch <本文件绝对路径>
- insert:
  - id: metaspirit
    name: "<ABS_PLUGIN_DIR>/src/index.ts"
    config:
      enginePath: "<ABS_PLUGIN_DIR>/engine"
      game: "minecraft"
      mllm:
        fast:
          provider: "openai"
          model: "deepseek-v4-flash"
          base_url_env: "DEEPSEEK_BASE_URL"
        deep:
          provider: "openai"
          model: "deepseek-v4"
          base_url_env: "DEEPSEEK_BASE_URL"
      budget:
        daily_usd_cap: 10.0
